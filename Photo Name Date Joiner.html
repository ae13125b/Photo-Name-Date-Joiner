<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartoon & Anime Photo Converter</title>
<style>
    :root {
        --bg: #0f172a;
        --card: #111827;
        --accent: #22d3ee;
        --accent2: #a78bfa;
        --text: #e5e7eb;
        --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020617, #111827 55%, #0f172a);
        color: var(--text);
        min-height: 100vh;
    }

    header {
        text-align: center;
        padding: 22px 12px;
        font-size: 28px;
        font-weight: 700;
        color: white;
    }

    .sub {
        text-align: center;
        color: var(--muted);
        margin-top: -8px;
        margin-bottom: 24px;
        padding: 0 10px;
    }

    .container {
        width: min(1060px, 94vw);
        margin: 0 auto 30px;
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.35);
        padding: 20px;
    }

    .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 22px;
    }

    .panel {
        background: rgba(2, 6, 23, 0.55);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 12px;
        padding: 16px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        color: #cbd5e1;
    }

    input[type="file"], select {
        width: 100%;
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: #0b1220;
        color: var(--text);
        padding: 10px;
        margin-bottom: 14px;
    }

    .btn-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
        color: #0f172a;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    button.secondary {
        background: #334155;
        color: #e2e8f0;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .preview-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .preview-box {
        background: #020617;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 12px;
        padding: 10px;
        text-align: center;
    }

    .preview-box h3 {
        margin: 0 0 8px;
        font-size: 14px;
        color: #cbd5e1;
    }

    canvas {
        width: 100%;
        max-height: 60vh;
        background: #000;
        border-radius: 8px;
    }

    .status {
        margin-top: 14px;
        font-size: 14px;
        color: var(--muted);
    }

    @media (max-width: 860px) {
        .layout { grid-template-columns: 1fr; }
        .preview-grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
<header>🎨 Cartoon & Anime Photo Converter</header>
<div class="sub">Upload your picture, choose a style, preview it, and download instantly.</div>

<div class="container">
    <div class="layout">
        <div class="panel">
            <label for="imageInput">Upload Image</label>
            <input type="file" id="imageInput" accept="image/*">

            <label for="styleSelect">Choose Style</label>
            <select id="styleSelect">
                <option value="cartoon">Cartoon</option>
                <option value="anime">Anime</option>
            </select>

            <div class="btn-row">
                <button id="convertBtn">Convert</button>
                <button id="downloadBtn" class="secondary" disabled>Download</button>
                <button id="resetBtn" class="secondary">Reset</button>
            </div>

            <div class="status" id="statusText">No image selected.</div>
        </div>

        <div class="panel preview-grid">
            <div class="preview-box">
                <h3>Original</h3>
                <canvas id="originalCanvas"></canvas>
            </div>
            <div class="preview-box">
                <h3>Converted</h3>
                <canvas id="outputCanvas"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
const imageInput = document.getElementById("imageInput");
const styleSelect = document.getElementById("styleSelect");
const convertBtn = document.getElementById("convertBtn");
const downloadBtn = document.getElementById("downloadBtn");
const resetBtn = document.getElementById("resetBtn");
const statusText = document.getElementById("statusText");

const originalCanvas = document.getElementById("originalCanvas");
const outputCanvas = document.getElementById("outputCanvas");
const oCtx = originalCanvas.getContext("2d");
const outCtx = outputCanvas.getContext("2d");

let uploadedImage = null;

function fitCanvasToImage(img, canvas, ctx) {
    const maxW = 640;
    const maxH = 640;
    const scale = Math.min(maxW / img.width, maxH / img.height, 1);
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);
    canvas.width = w;
    canvas.height = h;
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
}

function clamp(v) {
    return Math.max(0, Math.min(255, v));
}

function applyCartoon(data, width, height) {
    const copy = new Uint8ClampedArray(data);

    for (let i = 0; i < data.length; i += 4) {
        const r = copy[i], g = copy[i + 1], b = copy[i + 2];
        const brightness = (r + g + b) / 3;
        const levels = 6;
        const q = 255 / (levels - 1);
        data[i] = clamp(Math.round(r / q) * q + 18);
        data[i + 1] = clamp(Math.round(g / q) * q + 12);
        data[i + 2] = clamp(Math.round(b / q) * q + 8);

        if (brightness < 45) {
            data[i] = data[i + 1] = data[i + 2] = 0;
        }
    }

    for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
            const idx = (y * width + x) * 4;
            const right = idx + 4;
            const down = idx + width * 4;

            const edge =
                Math.abs(copy[idx] - copy[right]) +
                Math.abs(copy[idx + 1] - copy[right + 1]) +
                Math.abs(copy[idx + 2] - copy[right + 2]) +
                Math.abs(copy[idx] - copy[down]) +
                Math.abs(copy[idx + 1] - copy[down + 1]) +
                Math.abs(copy[idx + 2] - copy[down + 2]);

            if (edge > 120) {
                data[idx] = 10;
                data[idx + 1] = 10;
                data[idx + 2] = 10;
            }
        }
    }
}

function applyAnime(data) {
    for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i + 1], b = data[i + 2];
        const avg = (r + g + b) / 3;

        r = clamp((r - avg) * 1.6 + avg + 18);
        g = clamp((g - avg) * 1.35 + avg + 6);
        b = clamp((b - avg) * 1.35 + avg + 28);

        const glow = avg > 170 ? 20 : 0;

        data[i] = clamp(r + glow);
        data[i + 1] = clamp(g + glow / 2);
        data[i + 2] = clamp(b + glow);
    }
}

imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
        uploadedImage = img;
        fitCanvasToImage(img, originalCanvas, oCtx);
        outputCanvas.width = originalCanvas.width;
        outputCanvas.height = originalCanvas.height;
        outCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
        downloadBtn.disabled = true;
        statusText.textContent = "Image loaded. Click Convert.";
    };
    img.src = URL.createObjectURL(file);
});

convertBtn.addEventListener("click", () => {
    if (!uploadedImage) {
        alert("Please upload an image first.");
        return;
    }

    fitCanvasToImage(uploadedImage, outputCanvas, outCtx);
    const imageData = outCtx.getImageData(0, 0, outputCanvas.width, outputCanvas.height);
    const data = imageData.data;

    if (styleSelect.value === "cartoon") {
        applyCartoon(data, outputCanvas.width, outputCanvas.height);
        statusText.textContent = "Cartoon conversion complete.";
    } else {
        applyAnime(data);
        statusText.textContent = "Anime conversion complete.";
    }

    outCtx.putImageData(imageData, 0, 0);
    downloadBtn.disabled = false;
});

downloadBtn.addEventListener("click", () => {
    if (downloadBtn.disabled) return;
    const link = document.createElement("a");
    link.download = `converted-${styleSelect.value}.png`;
    link.href = outputCanvas.toDataURL("image/png");
    link.click();
});

resetBtn.addEventListener("click", () => {
    imageInput.value = "";
    uploadedImage = null;
    oCtx.clearRect(0, 0, originalCanvas.width, originalCanvas.height);
    outCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
    originalCanvas.width = originalCanvas.height = 0;
    outputCanvas.width = outputCanvas.height = 0;
    downloadBtn.disabled = true;
    statusText.textContent = "No image selected.";
});
</script>
</body>
</html>
